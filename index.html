<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FFLogs Ultimate Pull Loader</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
      :root {
        color: #1f2933;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.45;
      }

      body {
        margin: 0;
        background: #fafafa;
      }

      main {
        margin: 0 auto;
        max-width: none;
        padding: 28px clamp(12px, 2vw, 28px) 48px;
        width: 100%;
        box-sizing: border-box;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
      }

      h2 {
        font-size: 15px;
        font-weight: 700;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input,
      select {
        border: 1px solid #c9d0d8;
        border-radius: 6px;
        box-sizing: border-box;
        min-height: 38px;
        padding: 8px 10px;
        width: 100%;
      }

      button {
        background: #233142;
        border: 1px solid #233142;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        min-height: 38px;
        padding: 8px 12px;
      }

      button.secondary {
        background: white;
        border-color: #c9d0d8;
        color: #233142;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .split-download {
        display: inline-flex;
        position: relative;
      }

      .split-download[hidden] {
        display: none;
      }

      .split-download button {
        border-radius: 0;
      }

      .split-download-main {
        border-bottom-left-radius: 6px !important;
        border-top-left-radius: 6px !important;
      }

      .split-download-menu {
        border-bottom-right-radius: 6px !important;
        border-left-color: rgba(255, 255, 255, 0.35);
        border-top-right-radius: 6px !important;
        min-width: 38px;
        padding-inline: 9px;
      }

      .split-download-options {
        background: white;
        border: 1px solid #c9d0d8;
        border-radius: 6px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
        display: none;
        min-width: 150px;
        padding: 4px;
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        z-index: 5;
      }

      .split-download.open .split-download-options {
        display: grid;
      }

      .split-download-options button {
        background: white;
        border: 0;
        border-radius: 4px;
        color: #233142;
        min-height: 34px;
        padding: 7px 9px;
        text-align: left;
      }

      .split-download-options button:hover {
        background: #f1f4f7;
      }

      pre {
        background: #111827;
        border-radius: 6px;
        color: #f9fafb;
        margin: 12px 0 0;
        max-height: 320px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      .topbar,
      .surface-head {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }

      .topbar {
        margin-bottom: 22px;
      }

      .actions,
      .ultimate-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .section,
      .surface {
        background: white;
        border: 1px solid #e0e4e8;
        border-radius: 8px;
        padding: 16px;
      }

      /* Component display rules must not override conditional surface state. */
      #data-summary[hidden],
      #bar-surface[hidden],
      #sankey-surface[hidden],
      #debug-section[hidden] {
        display: none;
      }

      .source-grid {
        align-items: end;
        display: grid;
        gap: 12px;
        grid-template-columns: auto 1px minmax(280px, 1fr) auto;
      }

      .source-connect {
        display: flex;
        justify-content: center;
        padding: 12px 0;
      }

      /* This component sets display:flex, so explicitly preserve HTML hidden state. */
      .source-connect[hidden] {
        display: none;
      }

      .source-connect button {
        min-width: 180px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: #44505c;
        font-size: 12px;
        font-weight: 700;
      }

      #source-section.manual-only .source-grid {
        grid-template-columns: minmax(280px, 1fr) auto;
      }

      .profile-source-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .profile-source-actions[hidden],
      .source-divider[hidden] {
        display: none;
      }

      .profile-source {
        background: white;
        border-color: #c9d0d8;
        color: #344150;
      }

      .profile-source.active {
        background: #233142;
        border-color: #233142;
        color: white;
      }

      #analyze {
        background: #2b674f;
        border-color: #2b674f;
      }

      .source-divider {
        align-self: stretch;
        border-left: 1px solid #e0e4e8;
      }

      .ultimate-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .zone-group,
      .zone-detail-list {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .zone-choice,
      .ultimate-choice {
        background: #f6f8fa;
        border: 1px solid #d8dee5;
        border-radius: 6px;
        color: #243142;
        cursor: pointer;
        min-height: auto;
        padding: 9px 11px;
      }

      .zone-choice {
        align-items: center;
        display: flex;
        gap: 8px;
        text-align: left;
      }

      .zone-choice.active,
      .zone-choice:hover,
      .ultimate-choice.active,
      .ultimate-choice:hover {
        background: #233142;
        border-color: #233142;
        color: white;
      }

      .zone-detail-list .ultimate-choice {
        width: fit-content;
      }

      .zone-meta {
        color: #66727f;
        font-size: 13px;
      }

      .zone-choice:hover .zone-meta {
        color: #e6ebf0;
      }

      .ultimate-choice.loading {
        cursor: progress;
      }

      .muted {
        color: #66727f;
        font-size: 13px;
      }

      .status {
        font-weight: 700;
        margin-top: 10px;
      }

      .ok {
        color: #176b4d;
      }

      .error {
        color: #b91c1c;
      }

      .summary {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(180px, 1.1fr) minmax(90px, 0.5fr) minmax(235px, 1.5fr) minmax(110px, 0.6fr) minmax(180px, 1fr);
      }

      .stat {
        border-right: 1px solid #e0e4e8;
        padding-right: 12px;
      }

      .stat:last-child {
        border-right: 0;
      }

      .stat strong {
        display: block;
        font-size: 21px;
        margin-top: 3px;
      }

      .time-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 3px;
      }

      .time-summary-value {
        align-items: baseline;
        display: inline-flex;
        white-space: nowrap;
      }

      .time-duration {
        align-items: baseline;
        display: inline-flex;
        font-variant-numeric: tabular-nums;
        gap: 3px;
      }

      .time-duration-number {
        font-size: 21px;
        font-weight: 700;
      }

      .time-duration-unit {
        color: #66727f;
        font-size: 13px;
        font-weight: 600;
      }

      .time-summary-value .muted {
        margin-left: 4px;
      }

      .tabs {
        border-bottom: 1px solid #e0e4e8;
        display: flex;
        gap: 18px;
        margin: -2px 0 14px;
        overflow-x: auto;
      }

      .tab-spacer {
        flex: 1 0 8px;
      }

      .tabs .split-download {
        flex: 0 0 auto;
        margin-bottom: 4px;
      }

      .visually-hidden {
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        width: 1px;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .tab {
        background: transparent;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        color: #66727f;
        flex: 0 0 auto;
        font-size: 17px;
        min-height: auto;
        padding: 10px 0 9px;
      }

      .tab.active {
        border-bottom-color: #233142;
        color: #233142;
        font-weight: 700;
      }

      .surface-head {
        margin-bottom: 14px;
      }

      .chart-panel {
        align-items: center;
        background: white;
        border: 1px solid #e0e4e8;
        border-radius: 8px;
        color: #66727f;
        display: none;
        font-weight: 700;
        justify-content: center;
        min-height: clamp(340px, 48vh, 620px);
        overflow: hidden;
        position: relative;
      }

      .chart-panel.active {
        display: flex;
      }

      .chart-panel.sankey-panel {
        min-height: clamp(500px, 62vh, 780px);
      }

      .chart-loading {
        align-items: center;
        display: flex;
        gap: 10px;
      }

      .chart-loading::before {
        animation: spin 0.8s linear infinite;
        border: 3px solid #d8dee5;
        border-top-color: #233142;
        border-radius: 999px;
        content: "";
        height: 18px;
        width: 18px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .chart-panel svg {
        display: block;
        min-width: 0;
        width: 100%;
      }

      .chart-tooltip,
      .sankey-tooltip {
        background: white;
        border: 1px solid #c7ced8;
        border-radius: 4px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        color: #17202a;
        font-size: 12px;
        max-width: 320px;
        padding: 8px;
        pointer-events: none;
        position: absolute;
        z-index: 3;
      }

      .chart-tooltip {
        border-radius: 6px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
        color: #243142;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        gap: 3px;
        line-height: 1.4;
        max-width: none;
        min-width: 0;
        padding: 9px 10px;
        width: max-content;
      }

      .chart-tooltip-date {
        color: #66727f;
        font-weight: 600;
        margin-bottom: 3px;
      }

      .chart-tooltip-row {
        align-items: baseline;
        display: grid;
        gap: 7px;
        grid-template-columns: 10px 32px 48px 50px;
      }

      /* Derived meeting time has no phase swatch, so its label takes that slot. */
      .chart-tooltip-row-meeting .chart-tooltip-phase {
        grid-column: 1 / span 2;
      }

      .chart-tooltip-row-meeting .chart-tooltip-pct {
        grid-column: 3;
      }

      .chart-tooltip-row-meeting .chart-tooltip-value {
        grid-column: 4;
      }

      .chart-tooltip-dot {
        border-radius: 999px;
        display: inline-block;
        height: 9px;
        width: 9px;
      }

      .chart-tooltip-pct {
        background: #eef2f6;
        border-radius: 999px;
        color: #66727f;
        font-variant-numeric: tabular-nums;
        padding: 1px 5px;
        text-align: right;
      }

      .chart-tooltip-value {
        color: #17202a;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .bar-grid line {
        stroke: #d7dce2;
      }

      .bar-grid path {
        display: none;
      }

      .debug-panel {
        display: none;
      }

      .debug-panel.open {
        display: block;
      }

      @media (max-width: 900px) {
        .topbar,
        .surface-head {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }

        .source-grid,
        .summary {
          grid-template-columns: 1fr;
        }

        .source-divider {
          border-left: 0;
          border-top: 1px solid #e0e4e8;
        }

        .stat {
          border-bottom: 1px solid #e0e4e8;
          border-right: 0;
          padding-bottom: 10px;
        }
      }
      /* Editorial report treatment: designed for reading a progression story. */
      :root {
        color: #2a2520;
        font-family: Georgia, "Times New Roman", serif;
      }

      body {
        background: #f3efe6;
      }

      main {
        max-width: 1250px;
        padding: 56px 28px 90px;
      }

      .topbar {
        align-items: flex-end;
        border-bottom: 3px solid #2a2520;
        margin-bottom: 34px;
        padding-bottom: 22px;
      }

      .topbar h1 {
        font-size: clamp(38px, 5vw, 70px);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.92;
        margin-bottom: 18px;
        max-width: none;
        white-space: nowrap;
      }

      .topbar .muted {
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: none;
        white-space: nowrap;
      }

      .stack {
        gap: 32px;
      }

      #source-section {
        background: transparent;
        border: 0;
        border-bottom: 1px solid #c8bdad;
        border-radius: 0;
        padding: 0 0 24px;
      }

      #source-section input,
      #source-section select {
        background: #fffdf8;
        border-color: #c8bdad;
        border-radius: 0;
      }

      #source-section button {
        background: #2a2520;
        border-color: #2a2520;
        border-radius: 0;
        color: #fffdf8;
      }

      #source-section .profile-source,
      #source-section .zone-choice,
      #source-section .ultimate-choice {
        background: #2a2520;
        border-color: #2a2520;
        color: #fffdf8;
      }

      #source-section .profile-source:hover,
      #source-section .profile-source.active,
      #source-section .zone-choice:hover,
      #source-section .zone-choice.active,
      #source-section .ultimate-choice:hover,
      #source-section .ultimate-choice.active {
        background: #51483d;
        border-color: #51483d;
        color: #fffdf8;
      }

      #source-section .zone-meta,
      #source-section .zone-choice:hover .zone-meta {
        color: #e1d8cb;
      }

      .summary {
        background: transparent;
        border: 0;
        border-radius: 0;
        grid-template-columns: 2fr repeat(4, 1fr);
        margin: 0;
        padding: 0;
      }

      .stat {
        background: transparent;
        border: 0;
        border-left: 1px solid #c8bdad;
        border-radius: 0;
        min-height: auto;
        padding: 0 20px;
      }

      .stat:first-child {
        border-left: 0;
        padding-left: 0;
      }

      .stat strong {
        font-size: 24px;
      }

      .muted,
      .time-duration-unit {
        color: #7f7364;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      .surface {
        background: transparent;
        border: 0;
        border-radius: 0;
        padding: 0;
      }

      .tabs {
        border-bottom: 1px solid #2a2520;
        margin: 0 0 16px;
        padding: 0;
      }

      .tab {
        border-width: 2px;
        color: #7f7364;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      .tab.active {
        border-color: #bd5b35;
        color: #2a2520;
      }

      .chart-panel {
        background: #fffdf8;
        border: 1px solid #d8cdbd;
        box-shadow: 8px 8px 0 #e2d7c7;
      }

      .chart-panel svg {
        background: #fffdf8;
      }

      #sankey-surface {
        border-top: 3px solid #2a2520;
        padding-top: 26px;
      }

      #debug-section {
        border-top: 1px solid #c8bdad;
        padding-top: 18px;
      }

      @media (max-width: 760px) {
        main {
          padding: 30px 16px 54px;
        }

        .topbar {
          align-items: start;
        }

        .topbar h1 {
          white-space: normal;
        }

        .topbar .muted {
          white-space: normal;
        }

        .summary {
          grid-template-columns: 1fr 1fr;
          row-gap: 20px;
        }

        .stat:nth-child(odd) {
          border-left: 0;
          padding-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <div>
          <h1>Raid Progression Analytics</h1>
          <p class="muted">Load FFLogs pulls through first clear and review progression charts.</p>
          <div id="auth-status" class="status">Checking auth state...</div>
        </div>
      </div>

      <div class="stack">
        <section class="section" id="source-section">
          <div id="source-connect" class="source-connect" hidden>
            <button id="connect">Connect FFLogs</button>
          </div>
          <div id="source-workflow" hidden>
            <div class="source-grid">
              <div id="profile-source-actions" class="profile-source-actions" hidden></div>
              <div id="source-divider" class="source-divider" hidden aria-hidden="true"></div>
              <input
                id="source-url"
                aria-label="Paste an FFLogs link"
                placeholder="Paste FFLogs link"
                autocomplete="off"
                disabled
              />
              <button id="analyze" disabled>Analyze</button>
            </div>
            <div id="ultimate-list" class="ultimate-list"></div>
          </div>
        </section>

        <section id="data-summary" class="section summary" hidden>
          <div class="stat"><span class="muted">Selected</span><strong id="summary-selected">No fight loaded</strong></div>
          <div class="stat"><span class="muted">Pulls</span><strong id="summary-pulls">0</strong></div>
          <div class="stat">
            <span class="muted">Time</span>
            <div class="time-summary">
              <span class="time-summary-value"><span id="summary-pull-time" class="time-duration">-</span><span class="muted">pull</span></span>
              <span class="time-summary-value"><span id="summary-session-time" class="time-duration">-</span><span class="muted" title="Includes time between pulls: meetings, breaks, and DCs.">session</span></span>
            </div>
          </div>
          <div class="stat"><span id="summary-calendar-label" class="muted">Calendar days</span><strong id="summary-calendar-days">0</strong></div>
          <div class="stat"><span class="muted">Data window</span><strong id="summary-window">-</strong></div>
        </section>

        <section id="bar-surface" class="surface" hidden>
          <nav class="tabs" aria-label="Bar chart views">
            <button class="tab active" data-tab-group="bar" data-target="bar-time">Daily Hours</button>
            <button class="tab" data-tab-group="bar" data-target="bar-pulls">Daily Pull Count</button>
            <button class="tab" data-tab-group="bar" data-target="bar-meeting">Full Session Time</button>
            <span class="tab-spacer" aria-hidden="true"></span>
            <div class="split-download" data-download-family="bar" hidden>
              <button id="download-bar-html" class="split-download-main" disabled>Download HTML</button>
              <button
                id="download-bar-menu"
                class="split-download-menu"
                aria-label="More bar download options"
                disabled
              >
                v
              </button>
              <div class="split-download-options">
                <button id="download-bar-png" disabled>Download PNG</button>
                <button id="download-phase-csv" disabled>Download CSV</button>
              </div>
            </div>
          </nav>
          <p id="bar-status" class="visually-hidden" aria-live="polite"></p>
          <div id="bar-time" class="chart-panel active"></div>
          <div id="bar-pulls" class="chart-panel"></div>
          <div id="bar-meeting" class="chart-panel"></div>
        </section>

        <section id="sankey-surface" class="surface" hidden>
          <nav class="tabs" aria-label="Sankey chart views">
            <button class="tab active" data-tab-group="sankey" data-target="sankey-time">Phase Time Progression</button>
            <button class="tab" data-tab-group="sankey" data-target="sankey-pulls">Phase Pull Progression</button>
            <button class="tab" data-tab-group="sankey" data-target="sankey-meeting">Full Session Time</button>
            <span class="tab-spacer" aria-hidden="true"></span>
            <div class="split-download" data-download-family="sankey" hidden>
              <button id="download-sankey-html" class="split-download-main" disabled>Download HTML</button>
              <button
                id="download-sankey-menu"
                class="split-download-menu"
                aria-label="More Sankey download options"
                disabled
              >
                v
              </button>
              <div class="split-download-options">
                <button id="download-sankey-png" disabled>Download PNG</button>
                <button id="download-meeting-csv" disabled>Download CSV</button>
              </div>
            </div>
          </nav>
          <p id="sankey-status" class="visually-hidden" aria-live="polite"></p>
          <div id="sankey-time" class="chart-panel sankey-panel active"></div>
          <div id="sankey-pulls" class="chart-panel sankey-panel"></div>
          <div id="sankey-meeting" class="chart-panel sankey-panel"></div>
        </section>

        <section id="debug-section" class="section" hidden>
          <div class="surface-head">
            <div>
              <h2>Exports And Debug</h2>
              <p id="workflow-status" class="muted">Idle</p>
            </div>
            <div class="actions">
              <button id="render-live-sankey" class="secondary" disabled>Render Loaded Charts</button>
              <button id="render-fixture-sankey" class="secondary">Render Planning Fixture</button>
              <button id="copy" class="secondary" disabled>Copy JSON</button>
              <button id="download" class="secondary" disabled>Download JSON</button>
              <button id="copy-pulls-csv" class="secondary" disabled>Copy Pull CSV</button>
              <button id="download-pulls-csv" class="secondary" disabled>Pull CSV</button>
              <button id="download-debug-csvs" class="secondary" disabled>Debug CSVs</button>
              <button id="download-discovery-reports" class="secondary" disabled>Download Discovery Reports</button>
            </div>
          </div>
          <details>
            <summary class="muted">Show result JSON</summary>
            <pre id="output"></pre>
          </details>
        </section>
      </div>
    </main>

    <script type="module">
      import { queryFflogs } from "./src/fflogs/api/fflogsClient.js";
      import {
        buildPullSankeyFromPulls,
        buildTimeSankeyFromPulls,
        buildTimeWithMeetingSankeyFromPulls,
        calculateRaidDurationsByDate,
      } from "./src/charts/sankey/sankeyData.js";
      import { renderSankey } from "./src/charts/sankey/sankeyRenderer.js";
      import {
        buildMeetingTimeBarFromPulls,
        buildPullBarFromPulls,
        buildTimeBarFromPulls,

      // Development fixtures and raw exports are intentionally unavailable on

      /**
       * Execute one authenticated FFLogs GraphQL request.
       *
       * @param {object} request

      function queryWithToken(request) {
        return queryFflogs({ ...request, tokenStore });

      /**
       * Update a status element with optional success or error styling.
       *
       * @param {Element} element
       * @param {string} message
       * @param {"ok"|"error"|""} tone
       */
      function setStatus(element, message, tone = "") {

      /**

          family === "bar"

        wrapper.classList.remove("open");

        }

      /**

      function resetChartExportState() {
        setChartExportState("bar", false);
        setChartExportState("sankey", false);
      }

      /**
       * Replace chart contents with a consistent loading placeholder.
       *
       * @param {HTMLElement[]} panels
       * @param {string} message
       */
      function setChartLoading(panels, message) {
        for (const panel of panels) {
          panel.replaceChildren();
          const loading = document.createElement("div");
          loading.className = "chart-loading";
          loading.textContent = message;
          panel.append(loading);
        }
      }

      /**
       * Replace chart contents with a visible error message.
       *
       * @param {HTMLElement[]} panels
       * @param {string} message
       */
      function setChartError(panels, message) {
        for (const panel of panels) {
          panel.replaceChildren();
          const error = document.createElement("div");
          error.className = "error";
          error.textContent = message;
          panel.append(error);
        }
      }

      /**
       * Yield once so loading indicators can paint before expensive rendering.
       *
       * @returns {Promise<void>}
       */
      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(() => resolve()));
      }

      /**
       * Ensure the D3 Sankey plugin is available before rendering Sankey charts.
       *
       * The page has a normal script tag for the plugin, but this fallback keeps
       * Sankey rendering resilient when that CDN request is blocked or delayed.
       *
       * @returns {Promise<void>}
       */
      async function ensureSankeyLibrary() {
        if (globalThis.d3?.sankey) return;
        if (!globalThis.d3) throw new Error("D3 library is not loaded.");

        sankeyLibraryPromise ||= new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js";
          script.async = true;
          script.onload = () => {
            if (globalThis.d3?.sankey) {
              resolve();
            } else {
              reject(new Error("D3 Sankey library loaded but did not register d3.sankey."));
            }
          };
          script.onerror = () => reject(new Error("D3 Sankey library failed to load."));
          document.head.append(script);
        });

        await sankeyLibraryPromise;
      }

      /**
       * Update the compact loaded-data summary row.
       *
       * @param {object} summary
       */
      function updateSummary({
        selected = "No fight loaded",
        pulls = 0,
        pullDurationMs = null,
        sessionDurationMs = null,
        calendarDays = 0,
        window = "-",
      } = {}) {
        summarySelectedEl.textContent = selected;
        summaryPullsEl.textContent = String(pulls);
        renderSummaryDuration(summaryPullTimeEl, pullDurationMs);
        renderSummaryDuration(summarySessionTimeEl, sessionDurationMs);
        summaryCalendarLabelEl.textContent = calendarDays === 1 ? "Calendar day" : "Calendar days";
        summaryCalendarDaysEl.textContent = String(calendarDays);
        summaryWindowEl.textContent = window;
        dataSummaryEl.hidden = selected === "No fight loaded";
      }

      /** Calculate summary durations using the same daily session definition as charts. */
      function buildSummaryMetrics(pulls = []) {
        const pullDurationMs = pulls.reduce((total, pull) => total + Number(pull.pullDurationMs || 0), 0);
        const sessionDurationSeconds = [...calculateRaidDurationsByDate(pulls).values()]
          .reduce((total, durationSeconds) => total + Number(durationSeconds || 0), 0);
        const calendarDays = new Set(pulls.map((pull) => pull.raidDate).filter(Boolean)).size;
        return {
          calendarDays,
          pullDurationMs,
          sessionDurationMs: sessionDurationSeconds * 1_000,
        };
      }

      /** Render duration values with distinct, readable number and unit styles. */
      function renderSummaryDuration(element, durationMs) {
        const duration = Number(durationMs);
        if (!Number.isFinite(duration)) {
          element.textContent = "-";
          element.removeAttribute("aria-label");
          return;
        }
        const totalMinutes = Math.max(0, Math.round(duration / 60_000));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        const parts = hours > 0 ? [[hours, "h"], [minutes, "m"]] : [[minutes, "m"]];
        element.replaceChildren(...parts.flatMap(([value, unit]) => {
          const number = document.createElement("span");
          number.className = "time-duration-number";
          number.textContent = String(value);
          const unitLabel = document.createElement("span");
          unitLabel.className = "time-duration-unit";
          unitLabel.textContent = unit;
          return [number, unitLabel];
        }));
        element.setAttribute("aria-label", formatSummaryDuration(duration));
      }

      /** Format a non-negative millisecond duration as a compact hours/minutes value. */
      function formatSummaryDuration(durationMs) {
        const totalMinutes = Math.max(0, Math.round(Number(durationMs || 0) / 60_000));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return hours > 0 ? `${hours}h ${String(minutes).padStart(2, "0")}m` : `${minutes}m`;
      }

      /** Show or hide both chart families as one result surface. */
      function setChartSurfacesVisible(visible) {
        barSurfaceEl.hidden = !visible;
        sankeySurfaceEl.hidden = !visible;
      }

      /**
       * Activate one chart panel within the selected tab group.
       *
       * @param {HTMLButtonElement} tab
       */
      function activateChartTab(tab) {
        const group = tab.dataset.tabGroup;
        const targetId = tab.dataset.target;
        if (!group || !targetId) return;

        document.querySelectorAll(`.tab[data-tab-group="${group}"]`).forEach((candidate) => {
          candidate.classList.toggle("active", candidate === tab);
        });
        document.querySelectorAll(`.chart-panel[id^="${group}-"]`).forEach((panel) => {
          panel.classList.toggle("active", panel.id === targetId);
        });
      }

      /**
       * Toggle one split-button download menu.
       *
       * @param {HTMLElement} splitControl
       */
      function toggleDownloadMenu(splitControl) {
        if (!splitControl || splitControl.hidden) return;
        const shouldOpen = !splitControl.classList.contains("open");
        document.querySelectorAll(".split-download.open").forEach((control) => control.classList.remove("open"));
        splitControl.classList.toggle("open", shouldOpen);
      }

      /**
       * Close every open split download menu.
       */
      function closeDownloadMenus() {
        document.querySelectorAll(".split-download.open").forEach((control) => control.classList.remove("open"));
      }

      /**
       * Mark one rendered profile source as selected, or clear selection when
       * the user analyzes a manually pasted source.
       *
       * @param {string|null} sourceId
       */
      function setSelectedProfileSource(sourceId) {
        profileSourceActionsEl.querySelectorAll(".profile-source").forEach((button) => {
          const isSelected = button.dataset.sourceId === sourceId;
          button.classList.toggle("active", isSelected);
          button.setAttribute("aria-pressed", String(isSelected));

      }

      /**
       * Render the direct profile-source buttons and start the default source.
       * One Static is shown at most; personal logs stays visible as the fallback.
       */
      async function initializeAutomaticSourceFlow() {
        state.sourceOptions = buildPrimaryReportSourceActions(state.currentUser);
        sourceConnectEl.hidden = true;
        sourceWorkflowEl.hidden = false;
        sourceUrlEl.disabled = false;
        analyzeBtn.disabled = false;
        profileSourceActionsEl.hidden = state.sourceOptions.length === 0;
        sourceDividerEl.hidden = state.sourceOptions.length === 0;
        sourceSectionEl.classList.toggle("manual-only", state.sourceOptions.length === 0);
        profileSourceActionsEl.replaceChildren(
          ...state.sourceOptions.map((source) => {
            const button = document.createElement("button");
            button.className = "profile-source";
            button.dataset.sourceId = source.id;

            button.setAttribute("aria-pressed", "false");
            button.addEventListener("click", () => {
              setSelectedProfileSource(source.id);
              runDiscovery({ sourceUrl: source.url, automatic: true }).catch(handleWorkflowError);
            });
            return button;
          }),
        );

        if (!state.sourceOptions.length) {
          setStatus(workflowStatusEl, "Enter an FFLogs source link to analyze.");
          return;
        }

        setSelectedProfileSource(state.sourceOptions[0].id);
        await runDiscovery({ sourceUrl: state.sourceOptions[0].url, automatic: true });
      }

      /**
       * Surface a source-discovery failure without leaving stale chart panels.
       *
       * @param {Error} error
       */
      function handleWorkflowError(error) {
        console.error(error);
        setStatus(workflowStatusEl, error.message, "error");
        renderResult({ error: error.message });
      }

      /**
       * Write the exact discovery set to the browser console for FFLogs
       * pagination debugging without adding implementation detail to the UI.
       *
       * @param {object[]} reports
       */
      function logDiscoveredReports(reports) {
        console.debug("[FFLogs] Fetched discovery reports", toDiscoveryDebugReports(reports));
      }

      /** Log retained but intentionally hidden non-Ultimate zones for diagnosis. */
      function logIgnoredZones(zones) {
        const ignored = zones.filter((zone) => !isVisibleUltimateZoneName(zone.zoneName));
        if (ignored.length) console.debug("[FFLogs] Hidden non-Ultimate report zones", ignored);
      }

      /**
       * Normalize the fetched report list for console inspection and download.
       * This intentionally excludes authentication state and raw API payloads.
       *
       * @param {object[]} reports
       * @returns {object[]}
       */
      function toDiscoveryDebugReports(reports) {
        return reports.map((report) => ({
          code: report.code,
          name: report.title || "Untitled report",
          zoneId: report.zone?.id ?? null,
          zoneName: report.zone?.name ?? null,
          startDate: Number.isFinite(Number(report.startTime))
            ? new Date(Number(report.startTime)).toISOString()
            : null,
          endDate: Number.isFinite(Number(report.endTime)) ? new Date(Number(report.endTime)).toISOString() : null,
        }));
      }

      /**
       * Build a token-free capture of report discovery for fixture creation.
       *
       * @returns {object|null}
       */
      function buildDiscoveryReportDebugExport() {
        if (!state.discovery) return null;

        return {
          capturedAt: new Date().toISOString(),
          config: sanitizeConfig(state.config),
          pagination: state.discovery.pagination,
          pagesFetched: state.discovery.pagesFetched,
          reports: toDiscoveryDebugReports(state.discovery.reports),
        };
      }

      /**
       * Load optional source identity for display and final bundle metadata.
       *
       * @param {object} config
       * @returns {Promise<object|null>}
       */
      async function loadSourceIdentity(config) {
        if (config.guildId != null) {
          return loadGuildById({
            guildId: config.guildId,
            guildUrl: config.guildUrl,
            queryFflogs: queryWithToken,
          });
        }

        if (config.userId != null) {
          return {
            source: "fflogs",
            sourceType: "user",
            userId: config.userId,
            userUrl: config.userUrl,
          };
        }

        return null;
      }

      /**
       * Discover supported Ultimates for a source's available FFLogs history.
       */
      async function runDiscovery({ sourceUrl = sourceUrlEl.value, automatic = false } = {}) {
        setStatus(workflowStatusEl, automatic ? "Finding available Ultimate reports..." : "Analyzing source link...");
        ultimateListEl.innerHTML = '<div class="muted">Loading...</div>';
        state.csvExports = null;
        state.latestBundle = null;
        state.selectedUltimate = null;
        state.activeZoneKey = null;
        state.activeEncounterId = null;
        state.zoneOrder = [];
        state.zoneLoads.clear();
        state.zoneViews.clear();
        state.reportDetailsByCode.clear();
        state.discoveryInProgress = true;
        downloadDiscoveryReportsBtn.disabled = true;
        setCsvExportState(false);
        resetChartExportState();
        setChartSurfacesVisible(false);
        renderLiveSankeyBtn.disabled = true;
        updateSummary();

        state.config = buildWorkflowSourceConfig({
          sourceUrl,
          timeFrame: { preset: "all-history" },
        });
        state.team = await loadSourceIdentity(state.config);
        state.discovery = await discoverAvailableUltimates({
          config: state.config,
          queryFflogs: queryWithToken,
          reportLimit: 100,
          onUpdate: async (update) => {
            state.discovery = update;
            feedOpenZones(update.zones);
            renderZoneList(update.zones);
            const totalPages = update.progress.totalPages ?? "?";
            setStatus(
              workflowStatusEl,
              `Fetching report pages ${update.progress.pagesFetched} of ${totalPages} (${update.progress.reportsFetched} reports)...`,
            );
          },
        });
        state.discoveryInProgress = false;
        closeOpenZoneLoads();
        logDiscoveredReports(state.discovery.reports);
        logIgnoredZones(state.discovery.zones);
        downloadDiscoveryReportsBtn.disabled = false;

        renderZoneList(state.discovery.zones);
        renderResult({
          currentUser: state.currentUser,
          source: state.team,
          config: sanitizeConfig(state.config),
          discoveredReports: state.discovery.reports.length,
          discoveryPagination: state.discovery.pagination,
          discoveryPagesFetched: state.discovery.pagesFetched,
          zones: state.discovery.zones.map(summarizeZone),
        });
        setStatus(workflowStatusEl, "Open an FFLogs zone to confirm its fights.", "ok");
      }

      /**
       * Render stable summary-zone rows and the confirmed fights from open zones.
       * Report summaries create scopes; they never create fight choices by name.
       */
      function renderZoneList(zones = []) {
        const orderedZones = orderZones(zones.filter((zone) => isVisibleUltimateZoneName(zone.zoneName)));
        if (!orderedZones.length) {
          ultimateListEl.innerHTML = '<div class="muted">Looking for FFLogs report zones...</div>';
          return;
        }
        ultimateListEl.replaceChildren(...orderedZones.map((zone) => {
          const view = state.zoneViews.get(zone.key) || zone;
          const loading = state.zoneLoads.has(zone.key);
          const wrapper = document.createElement("div");
          wrapper.className = "zone-group";
          const zoneButton = document.createElement("button");
          const displayName = zoneDisplayName(zone);
          zoneButton.className = `zone-choice${state.activeZoneKey === zone.key ? " active" : ""}`;
          zoneButton.innerHTML = `<span>${escapeHtml(displayName)}</span><span class="zone-meta">${view.detailsLoaded || 0} / ${zone.reportCount} reports${loading ? " · Loading..." : view.complete ? " · Ready" : ""}</span>`;
          zoneButton.title = `Open ${displayName} report details`;
          zoneButton.addEventListener("click", () => openZone(zone).catch(handleWorkflowError));
          wrapper.append(zoneButton);

          // One confirmed fight already makes this zone chip the selected
          // control. A second, identical button would add a redundant decision.
          if (state.activeZoneKey === zone.key && !hasSingleSupportedFight(view)) {
            const details = document.createElement("div");
            details.className = "zone-detail-list";
            if (!view.fights?.length) {
              details.innerHTML = `<span class="muted">${loading ? "Checking fights..." : "No supported fights confirmed in this zone."}</span>`;
            } else {
              for (const group of view.fights) {
                const encounterId = group.ultimate.encounterId;
                const button = document.createElement("button");
                button.className = `ultimate-choice${encounterId === state.activeEncounterId ? " active" : ""}`;
                button.textContent = `${fightDisplayName(group)} · ${group.reportCount} reports`;
                button.title = `Encounter ${encounterId}, confirmed in ${zone.zoneName}`;
                button.addEventListener("click", () => selectUltimate(group, view).catch(handleWorkflowError));
                details.append(button);
              }
            }
            wrapper.append(details);
          }
          return wrapper;
        }));
      }

      /** One currently confirmed fight leaves no fight-selection decision. */
      function hasSingleSupportedFight(zone) {
        return Boolean(zone?.fights?.length === 1);
      }

      /**
       * Add verified expansion provenance to a Legacy zone picker label.
       * This is display-only metadata; encounter IDs remain authoritative.
       */
      function zoneDisplayName(zone) {
        const expansion = zone?.zoneName === "Ultimates (Legacy)"
          ? findLegacyZoneExpansion(zone.zoneId)
          : null;
        return expansion ? `${zone.zoneName} · ${expansion}` : zone.zoneName;
      }

      /** Use the detail-derived variant label without duplicating its expansion. */
      function fightDisplayName(group) {
        return group.ultimate.displayName;
      }

      /** Preserve first-seen zone positions while summary pages stream in. */
      function orderZones(zones) {
        const byKey = new Map(zones.map((zone) => [zone.key, zone]));
        for (const key of byKey.keys()) if (!state.zoneOrder.includes(key)) state.zoneOrder.push(key);
        return state.zoneOrder.map((key) => byKey.get(key)).filter(Boolean);
      }

      /** Start, or focus, one zone's idempotent bounded detail queue. */
      async function openZone(zone) {
        state.activeZoneKey = zone.key;
        renderZoneList(state.discovery?.zones || []);
        const existing = state.zoneLoads.get(zone.key);
        if (existing) return existing.done;

        const loader = createZoneDetailLoader({
          zone,
          config: state.config,
          queryFflogs: queryWithToken,
          detailConcurrency: 3,
          detailsByCode: state.reportDetailsByCode,
          onUpdate: async (update) => {
            state.zoneViews.set(zone.key, update.zone);
            renderZoneList(state.discovery?.zones || []);
            if (
              state.activeZoneKey === zone.key
              && hasSingleSupportedFight(update.zone)
              && state.activeEncounterId !== update.zone.fights[0].ultimate.encounterId
            ) {
              await selectUltimate(update.zone.fights[0], update.zone);
              return;
            }
            if (state.activeZoneKey === zone.key && state.activeEncounterId != null) {
              const active = update.zone.fights.find((group) => group.ultimate.encounterId === state.activeEncounterId);
              if (active) await loadSelectedUltimate(active, update.zone, { renderCharts: update.zone.complete });
            }
            setStatus(workflowStatusEl, `Checking ${update.progress.current} of ${update.progress.total} reports in ${zone.zoneName}...`);
          },
        });
        state.zoneLoads.set(zone.key, loader);
        loader.enqueue(zone.reports);
        if (!state.discoveryInProgress) loader.close();
        loader.done.finally(() => {
          state.zoneLoads.delete(zone.key);
          renderZoneList(state.discovery?.zones || []);
        });
        return loader.done;
      }

      /** Feed reports released after a zone was opened into its same queue. */
      function feedOpenZones(zones) {
        for (const zone of zones) state.zoneLoads.get(zone.key)?.enqueue(zone.reports);
      }

      /** Close zone queues once no further summary page can contribute work. */
      function closeOpenZoneLoads() {
        for (const loader of state.zoneLoads.values()) loader.close();
      }

      /** Bind chart/output state to a confirmed fight from the active zone cache. */
      async function selectUltimate(group, zone) {
        if (state.activeZoneKey === zone.key && state.activeEncounterId === group.ultimate.encounterId) return;
        state.activeZoneKey = zone.key;
        state.activeEncounterId = group.ultimate.encounterId;
        state.selectedUltimate = group.ultimate;
        renderZoneList(state.discovery?.zones || []);
        await loadSelectedUltimate(group, zone, { renderCharts: zone.complete });
      }

      /** Rebuild one selected fight's graph input from its current zone cache. */
      async function loadSelectedUltimate(group, zone, { renderCharts = true } = {}) {
        updateSummary({
          selected: group.ultimate.displayName,
        });
        setStatus(workflowStatusEl, `Loading available data for ${group.ultimate.displayName}...`);
        resetChartExportState();
        if (renderCharts) {
          setChartSurfacesVisible(true);
          setChartLoading([barTimeEl, barMeetingEl, barPullsEl], "Rendering final chart data...");
          setChartLoading([sankeyTimeEl, sankeyMeetingEl, sankeyPullsEl], "Rendering final chart data...");
        } else {
          setChartSurfacesVisible(false);
          setChartLoading([barTimeEl, barMeetingEl, barPullsEl], "Loading all zone reports before rendering charts...");
          setChartLoading([sankeyTimeEl, sankeyMeetingEl, sankeyPullsEl], "Loading all zone reports before rendering charts...");
        }
        const bundle = await loadUltimateRaidData({
          ultimate: group.ultimate,
          candidateReports: group.reports,
          reportDetails: group.reportDetails,
          currentUser: state.currentUser,
          team: state.team,
        });
        const sortedPulls = bundle.pulls
          .slice()
          .sort((left, right) => Number(left.pullStartTimestamp || 0) - Number(right.pullStartTimestamp || 0));
        state.latestBundle = bundle;
        state.selectedUltimate = group.ultimate;
        state.csvExports = buildFflogsCsvExports(bundle);
        const summaryMetrics = buildSummaryMetrics(bundle.pulls);
        updateSummary({
          selected: group.ultimate.displayName,
          pulls: bundle.pulls.length,
          ...summaryMetrics,
          window:
            sortedPulls.length > 0
              ? `${sortedPulls[0]?.raidDate || "-"} - ${sortedPulls.at(-1)?.raidDate || "-"}`
              : "-",
        });

        renderResult({
          selectedUltimate: group.ultimate,
          summary: {
            reportCount: bundle.reports.length,
            pullCount: bundle.pulls.length,
            playerCount: bundle.players.length,
            phaseCount: bundle.phases.length,
            firstRaidDate: sortedPulls[0]?.raidDate || null,
            latestRaidDate: sortedPulls.at(-1)?.raidDate || null,
          },
          csvPreview: {
            pullData: state.csvExports.pullData.split("\n").slice(0, 8).join("\n"),
            phaseTimes: state.csvExports.phaseTimes.split("\n").slice(0, 8).join("\n"),
            meetingTimes: state.csvExports.meetingTimes.split("\n").slice(0, 8).join("\n"),
          },
          data: bundle,
        });
        setCsvExportState(renderCharts);
        renderLiveSankeyBtn.disabled = !renderCharts;
        if (renderCharts) {
          await renderChartsFromPulls(bundle.pulls, "Loaded FFLogs pulls", group.ultimate);
          setStatus(workflowStatusEl, `Loaded ${bundle.pulls.length} pull(s) from ${zone.detailsLoaded} report(s).`, "ok");
        } else {
          setStatus(workflowStatusEl, `Searching ${group.ultimate.displayName}; ${bundle.pulls.length} pull(s) cached...`);
        }
      }

      /**
       * Render all currently supported chart variants from normalized pull rows.
       *
       * @param {object[]} pulls
       * @param {string} label
       * @param {object|string|number|null} raidRef
       */
      async function renderChartsFromPulls(pulls, label, raidRef = null) {
        const colors = getChartColorsForRaid(raidRef);
        setChartSurfacesVisible(true);
        resetChartExportState();
        setChartLoading([barTimeEl, barMeetingEl, barPullsEl], "Rendering bar charts...");
        setChartLoading([sankeyTimeEl, sankeyMeetingEl, sankeyPullsEl], "Rendering Sankey charts...");
        await nextFrame();

        renderBarsFromPulls(pulls, label, colors);
        await renderSankeysFromPulls(pulls, label, colors);
      }

      /**
       * Render all Sankey variants from normalized pull rows.
       *
       * @param {object[]} pulls
       * @param {string} label
       * @param {object} colors
       */
      async function renderSankeysFromPulls(pulls, label, colors) {
        await ensureSankeyLibrary();

        const timeData = buildTimeSankeyFromPulls(pulls);
        const meetingData = buildTimeWithMeetingSankeyFromPulls(pulls);
        const pullData = buildPullSankeyFromPulls(pulls);

        renderSankey(sankeyTimeEl, timeData, { title: `${label}: Time by progression phase`, colors });
        renderSankey(sankeyMeetingEl, meetingData, {
          title: `${label}: Time by progression phase with meetings, breaks, and DCs`,
          colors,
        });
        renderSankey(sankeyPullsEl, pullData, { title: `${label}: Pulls by progression phase`, colors });
        setChartExportState("sankey", true);
        setStatus(
          sankeyStatusEl,
          `Rendered ${pulls.length} pull(s), ${timeData.nodes.length} time nodes, ${meetingData.nodes.length} meeting-time nodes, ${pullData.nodes.length} pull nodes.`,
          "ok",
        );
      }

      /**
       * Render all stacked bar variants from normalized pull rows.
       *
       * @param {object[]} pulls
       * @param {string} label
       * @param {object} colors
       */
      function renderBarsFromPulls(pulls, label, colors) {
        const timeData = buildTimeBarFromPulls(pulls);
        const meetingData = buildMeetingTimeBarFromPulls(pulls);
        const pullData = buildPullBarFromPulls(pulls);

        renderStackedBar(barTimeEl, timeData, { title: `${label}: Total time by phase`, colors });
        renderStackedBar(barMeetingEl, meetingData, {
          title: `${label}: Total time by phase with meetings, breaks, and DCs`,
          colors,
        });
        renderStackedBar(barPullsEl, pullData, { title: `${label}: Pull count by phase`, colors });
        setChartExportState("bar", true);
        setStatus(
          barStatusEl,
          `Rendered ${pulls.length} pull(s) across ${timeData.rows.length} calendar day(s).`,
          "ok",
        );
      }

      /**
       * Download a standalone HTML report for one chart family.
       *
       * The snapshot excludes FFLogs auth state and stores only the already
       * rendered SVGs plus a tiny hover/tab script for review outside the app.
       *
       * @param {"bar"|"sankey"} family
       */
      function downloadChartHtmlReport(family) {
        const html = buildChartHtmlReport(family);
        downloadText(`${buildExportBaseName(family)}.html`, html, "text/html");
        setStatus(workflowStatusEl, `${capitalize(family)} HTML downloaded.`, "ok");
      }

      /**
       * Download the currently visible chart in one family as a PNG.
       *
       * @param {"bar"|"sankey"} family
       * @returns {Promise<void>}
       */
      async function downloadActiveChartPng(family) {
        const panel = getActiveChartPanel(family);
        const svg = panel?.querySelector("svg");
        if (!svg) throw new Error(`No ${family} chart is rendered yet.`);

        const svgText = serializeSvgForDownload(svg);
        const image = new Image();
        const svgUrl = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml;charset=utf-8" }));

        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error(`${capitalize(family)} PNG export failed.`));
          image.src = svgUrl;
        });

        const viewBox = svg.viewBox.baseVal;
        const width = Math.max(1, viewBox?.width || svg.clientWidth || 1200);
        const height = Math.max(1, viewBox?.height || svg.clientHeight || 700);
        const canvas = document.createElement("canvas");
        canvas.width = width * 2;
        canvas.height = height * 2;

        const context = canvas.getContext("2d");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(svgUrl);

        const pngBlob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        if (!pngBlob) throw new Error(`${capitalize(family)} PNG export failed.`);

        downloadBlob(`${buildExportBaseName(family)}.png`, pngBlob);
        setStatus(workflowStatusEl, `${capitalize(family)} PNG downloaded.`, "ok");
      }

      /**
       * Build a self-contained chart-review document for one chart family.
       *
       * @param {"bar"|"sankey"} family
       * @returns {string}
       */
      function buildChartHtmlReport(family) {
        const panels = getChartExportPanels(family);
        const tabs = panels
          .map(
            (panel) =>
              `<button class="tab${panel.active ? " active" : ""}" data-target="${escapeHtml(panel.id)}">${escapeHtml(
                panel.label,
              )}</button>`,
          )
          .join("");
        const charts = panels
          .map(
            (panel) =>
              `<section id="${escapeHtml(panel.id)}" class="chart-panel${panel.active ? " active" : ""}">${panel.html}</section>`,
          )
          .join("");

        return `<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>${escapeHtml(getReportTitle(family))}</title>
    <style>
      :root {
        color: #1f2933;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.45;
      }
      body {
        background: #fafafa;
        margin: 0;
      }
      main {
        box-sizing: border-box;
        padding: 24px clamp(12px, 2vw, 28px) 42px;
        width: 100%;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
      }
      .muted {
        color: #66727f;
        font-size: 13px;
      }
      .summary {
        border-bottom: 1px solid #e0e4e8;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin: 14px 0;
        padding-bottom: 14px;
      }
      .tabs {
        border-bottom: 1px solid #e0e4e8;
        display: flex;
        gap: 18px;
        margin-bottom: 14px;
        overflow-x: auto;
      }
      .tab {
        background: transparent;
        border: 0;
        border-bottom: 2px solid transparent;
        color: #66727f;
        cursor: pointer;
        flex: 0 0 auto;
        font: inherit;
        font-size: 17px;
        padding: 10px 0 9px;
      }
      .tab.active {
        border-bottom-color: #233142;
        color: #233142;
        font-weight: 700;
      }
      .chart-panel {
        background: white;
        border: 1px solid #e0e4e8;
        border-radius: 8px;
        display: none;
        min-height: 60vh;
        overflow: hidden;
        position: relative;
      }
      .chart-panel.active {
        display: flex;
      }
      .chart-panel svg {
        display: block;
        width: 100%;
      }
      .chart-tooltip {
        background: white;
        border: 1px solid #c7ced8;
        border-radius: 6px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
        color: #243142;
        display: none;
        font-size: 12px;
        line-height: 1.4;
        max-width: 320px;
        padding: 8px 10px;
        pointer-events: none;
        position: fixed;
        white-space: pre-line;
        z-index: 3;
      }
      .bar-grid line {
        stroke: #d7dce2;
      }
      .bar-grid path {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>${escapeHtml(getReportTitle(family))}</h1>
      <div class="summary">
        <span class="muted">Selected: ${escapeHtml(summarySelectedEl.textContent)}</span>
        <span class="muted">Pulls: ${escapeHtml(summaryPullsEl.textContent)}</span>
        <span class="muted">Pull time: ${escapeHtml(summaryPullTimeEl.getAttribute("aria-label") || summaryPullTimeEl.textContent)}</span>
        <span class="muted">Full session time: ${escapeHtml(summarySessionTimeEl.getAttribute("aria-label") || summarySessionTimeEl.textContent)}</span>
        <span class="muted">${escapeHtml(summaryCalendarLabelEl.textContent)}: ${escapeHtml(summaryCalendarDaysEl.textContent)}</span>
        <span class="muted">Data window: ${escapeHtml(summaryWindowEl.textContent)}</span>
      </div>
      <nav class="tabs" aria-label="${escapeHtml(capitalize(family))} chart views">${tabs}</nav>
      ${charts}
      <div class="chart-tooltip"></div>
    </main>
    <script>
      const tooltip = document.querySelector(".chart-tooltip");
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((candidate) => candidate.classList.toggle("active", candidate === tab));
          document.querySelectorAll(".chart-panel").forEach((panel) => panel.classList.toggle("active", panel.id === tab.dataset.target));
        });
      });
      document.querySelectorAll("[data-tooltip]").forEach((target) => {
        target.addEventListener("mousemove", (event) => {
          tooltip.textContent = target.dataset.tooltip || "";
          tooltip.style.display = "block";
          const gap = 12;
          const tooltipWidth = tooltip.offsetWidth;
          const tooltipHeight = tooltip.offsetHeight;
          const maxLeft = Math.max(0, window.innerWidth - tooltipWidth);
          const maxTop = Math.max(0, window.innerHeight - tooltipHeight);
          const rightPosition = event.clientX + gap;
          const bottomPosition = event.clientY + gap;
          const left = rightPosition + tooltipWidth <= window.innerWidth
            ? rightPosition
            : event.clientX - tooltipWidth - gap;
          const top = bottomPosition + tooltipHeight <= window.innerHeight
            ? bottomPosition
            : event.clientY - tooltipHeight - gap;
          tooltip.style.left = Math.max(0, Math.min(left, maxLeft)) + "px";
          tooltip.style.top = Math.max(0, Math.min(top, maxTop)) + "px";
        });
        target.addEventListener("mouseleave", () => {
          tooltip.style.display = "none";
        });
      });
    <\/script>
  </body>
</html>`;
      }

      /**
       * Return rendered panel HTML for one chart family.
       *
       * @param {"bar"|"sankey"} family
       * @returns {{id: string, label: string, active: boolean, html: string}[]}
       */
      function getChartExportPanels(family) {
        return Array.from(document.querySelectorAll(`.tab[data-tab-group="${family}"]`)).map((tab) => {
          const panel = document.querySelector(`#${tab.dataset.target}`);
          return {
            id: tab.dataset.target,
            label: tab.textContent,
            active: tab.classList.contains("active"),
            html: sanitizeChartPanelHtml(panel),
          };
        });
      }

      /**
       * Clone one chart panel and remove live-only tooltip/loading elements.
       *
       * @param {HTMLElement} panel
       * @returns {string}
       */
      function sanitizeChartPanelHtml(panel) {
        if (!panel?.querySelector("svg")) return '<div class="muted">No chart rendered.</div>';
        const clone = panel.cloneNode(true);
        clone.querySelectorAll(".chart-tooltip, .sankey-tooltip, .chart-loading").forEach((node) => node.remove());
        clone.querySelectorAll("script").forEach((node) => node.remove());
        return clone.innerHTML;
      }

      /**
       * Return the currently selected panel in one chart family.
       *
       * @param {"bar"|"sankey"} family
       * @returns {HTMLElement|null}
       */
      function getActiveChartPanel(family) {
        return document.querySelector(`.chart-panel[id^="${family}-"].active`);
      }

      /**
       * Serialize one SVG with the app's SVG-only CSS included for image export.
       *
       * @param {SVGElement} svg
       * @returns {string}
       */
      function serializeSvgForDownload(svg) {
        const clone = svg.cloneNode(true);
        const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
        style.textContent = ".bar-grid line{stroke:#d7dce2}.bar-grid path{display:none}";
        clone.insertBefore(style, clone.firstChild);
        return new XMLSerializer().serializeToString(clone);
      }

      /**
       * Build a stable filename stem for chart exports.
       *
       * @param {"bar"|"sankey"} family
       * @returns {string}
       */
      function buildExportBaseName(family) {
        const selected = slugify(summarySelectedEl.textContent || "raid-progression");
        return `${selected}-${family}-charts`;
      }

      /**
       * Return the export document title.
       *
       * @param {"bar"|"sankey"} family
       * @returns {string}
       */
      function getReportTitle(family) {
        return `${summarySelectedEl.textContent || "Raid Progression"} ${capitalize(family)} Charts`;
      }

      /** Return a compact report-zone summary for debug output. */
      function summarizeZone(zone) {
        return {
          key: zone.key,
          zoneId: zone.zoneId,
          zoneName: zone.zoneName,
          reportCount: zone.reportCount,
        };
      }

      /**
       * Return copy-safe config data. This config does not contain token values.
       *
       * @param {object} config
       * @returns {object}
       */
      function sanitizeConfig(config) {
        return { ...config };
      }

      connectBtn.addEventListener("click", () =>
        startLogin({
          config: FFLOGS_CONFIG,
          locationLike: window.location,
          storage: window.sessionStorage,
        }),
      );

      document.querySelectorAll(".tab[data-tab-group]").forEach((tab) => {
        tab.addEventListener("click", () => activateChartTab(tab));
      });

      document.querySelectorAll(".split-download-menu").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleDownloadMenu(button.closest(".split-download"));
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".split-download")) closeDownloadMenus();
      });

      analyzeBtn.addEventListener("click", () => {
        setSelectedProfileSource(null);
        runDiscovery({ sourceUrl: sourceUrlEl.value }).catch(handleWorkflowError);
      });

      copyBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(JSON.stringify(state.latestResult, null, 2));
        setStatus(workflowStatusEl, "Result JSON copied.", "ok");
      });

      downloadBtn.addEventListener("click", () => {
        downloadText("fflogs-ultimate-pulls.json", JSON.stringify(state.latestResult, null, 2), "application/json");
      });

      copyPullsCsvBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(state.csvExports?.pullData || "");
        setStatus(workflowStatusEl, "Pull CSV copied.", "ok");
      });

      downloadPullsCsvBtn.addEventListener("click", () => {
        downloadText("fflogs-pull-data.csv", state.csvExports?.pullData || "", "text/csv");
      });

      downloadBarHtmlBtn.addEventListener("click", () => {
        closeDownloadMenus();
        downloadChartHtmlReport("bar");
      });

      downloadBarPngBtn.addEventListener("click", () => {
        closeDownloadMenus();
        downloadActiveChartPng("bar").catch((error) => {
          console.error(error);
          setStatus(workflowStatusEl, error.message, "error");
        });
      });

      downloadPhaseCsvBtn.addEventListener("click", () => {
        closeDownloadMenus();
        downloadText("fflogs-phase-times.csv", state.csvExports?.phaseTimes || "", "text/csv");
      });

      downloadSankeyHtmlBtn.addEventListener("click", () => {
        closeDownloadMenus();
        downloadChartHtmlReport("sankey");
      });

      downloadSankeyPngBtn.addEventListener("click", () => {
        closeDownloadMenus();
        downloadActiveChartPng("sankey").catch((error) => {
          console.error(error);
          setStatus(workflowStatusEl, error.message, "error");
        });
      });

      downloadMeetingCsvBtn.addEventListener("click", () => {
        closeDownloadMenus();
        downloadText("fflogs-meeting-times.csv", state.csvExports?.meetingTimes || "", "text/csv");
      });

      downloadDebugCsvsBtn.addEventListener("click", () => {
        downloadText("fflogs-reports.csv", state.csvExports?.reports || "", "text/csv");
        downloadText("fflogs-players.csv", state.csvExports?.players || "", "text/csv");
        downloadText("fflogs-phases.csv", state.csvExports?.phases || "", "text/csv");
      });

      downloadDiscoveryReportsBtn.addEventListener("click", () => {
        const capture = buildDiscoveryReportDebugExport();
        if (!capture) return;

        downloadText("fflogs-discovery-reports.json", JSON.stringify(capture, null, 2), "application/json");
        setStatus(workflowStatusEl, "Discovery report capture downloaded.", "ok");
      });

      renderLiveSankeyBtn.addEventListener("click", () => {
        if (!state.latestBundle?.pulls?.length) {
          setStatus(sankeyStatusEl, "No loaded pulls available.", "error");
          return;
        }
        renderChartsFromPulls(state.latestBundle.pulls, "Loaded FFLogs pulls", state.selectedUltimate).catch((error) => {
          console.error(error);
          setStatus(sankeyStatusEl, error.message, "error");
          setChartError([sankeyTimeEl, sankeyMeetingEl, sankeyPullsEl], error.message);
        });
      });

      renderFixtureSankeyBtn.addEventListener("click", async () => {
        setStatus(sankeyStatusEl, "Loading Planning fixture...");
        state.csvExports = null;
        setCsvExportState(false);
        try {
          const response = await fetch("./Planning/fflogs-pull-data.csv");
          if (!response.ok) throw new Error(`Planning fixture failed with HTTP ${response.status}`);
          const rows = parseCsv(await response.text());
          const pulls = pullCsvRowsToNormalizedPulls(rows);
          await renderChartsFromPulls(pulls, "Planning fixture", "dm");
        } catch (error) {
          console.error(error);
          setStatus(sankeyStatusEl, error.message, "error");
          setStatus(barStatusEl, error.message, "error");
          setChartError([sankeyTimeEl, sankeyMeetingEl, sankeyPullsEl], error.message);
        }
      });

      /**
       * Download a text payload from the browser.
       *
       * @param {string} filename
       * @param {string} contents
       * @param {string} type
       */
      function downloadText(filename, contents, type) {
        const blob = new Blob([contents], { type });
        downloadBlob(filename, blob);
      }

      /**
       * Download a prepared Blob from the browser.
       *
       * @param {string} filename
       * @param {Blob} blob
       */
      function downloadBlob(filename, blob) {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        URL.revokeObjectURL(url);
      }

      /**
       * Escape text inserted into generated HTML documents.
       *
       * @param {string} value
       * @returns {string}
       */
      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      /**
       * Convert display text into a conservative filename fragment.
       *
       * @param {string} value
       * @returns {string}
       */
      function slugify(value) {
        return (
          String(value || "raid-progression")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "") || "raid-progression"
        );
      }

      /**
       * Capitalize a short UI label.
       *
       * @param {string} value
       * @returns {string}
       */
      function capitalize(value) {
        return `${String(value || "").slice(0, 1).toUpperCase()}${String(value || "").slice(1)}`;
      }

      try {
        await completeLogin({
          config: FFLOGS_CONFIG,
          locationLike: window.location,
          storage: window.sessionStorage,
          tokenStore,
        });

        if (tokenStore.isAuthenticated()) {
          state.currentUser = await loadCurrentUser({ queryFflogs: queryWithToken });
          setStatus(authStatusEl, `Authenticated as ${state.currentUser?.name || "FFLogs user"}.`, "ok");
          await initializeAutomaticSourceFlow();
        } else {
          sourceConnectEl.hidden = false;
          setStatus(authStatusEl, "Not authenticated. Click Connect FFLogs.");
        }
      } catch (error) {
        console.error(error);
        tokenStore.clearToken();
        analyzeBtn.disabled = true;
        sourceUrlEl.disabled = true;
        sourceConnectEl.hidden = false;
        sourceWorkflowEl.hidden = true;
        profileSourceActionsEl.replaceChildren();
        profileSourceActionsEl.hidden = true;
        sourceDividerEl.hidden = true;
        sourceSectionEl.classList.add("manual-only");
        setStatus(authStatusEl, "Not authenticated. Click Connect FFLogs.");
      }
    </script>
  </body>
</html>
